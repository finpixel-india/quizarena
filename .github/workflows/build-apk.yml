name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Node Dependencies
        run: npm install

      - name: Build Static Web App
        run: npm run build:static

      - name: Sync Web Assets to Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare QuizLab.apk
        run: |
          mkdir -p dist-apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} dist-apk/QuizLab.apk \;
          ls -la dist-apk/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizLab-Android-APK
          path: dist-apk/QuizLab.apk
          retention-days: 30

      - name: Publish GitHub Release (Direct APK Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: latest
          name: "QuizLab Android App"
          body: |
            ### 📱 QuizLab Offline Android App
            Download **`QuizLab.apk`** directly below to install on your Android device!
            - 100% Offline (all quizzes, notes, articulate cards included)
            - Lightweight (~6 MB)
          files: dist-apk/QuizLab.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
